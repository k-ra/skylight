<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skylight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --void:#05070b; --ink:#e2eaf4; --dim:#8792a1; --faint:#48525f; --agent:#ff6b3b; --q:#8fb4ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--void); color:var(--ink); overflow:hidden; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; cursor:none; }
  .bar { position:fixed; bottom:0; left:0; right:0; z-index:8; display:flex; align-items:center; gap:14px; padding:15px 22px;
         font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); pointer-events:none; }
  .bar b { color:var(--ink); font-weight:500; }
  .bar .mark { pointer-events:auto; width:22px; height:22px; display:inline-flex; cursor:default; }
  .bar .mark svg { width:22px; height:22px; fill:#fff; filter:drop-shadow(0 0 6px rgba(255,255,255,.6)); }
  .panel.crew { right:auto; top:auto; left:22px; bottom:118px; width:min(400px, calc(100vw - 44px)); }
  .crew .a { display:grid; gap:2px; padding:6px 0 6px 12px; border-left:1px solid rgba(226,234,244,.12); margin-bottom:4px; grid-template-columns:auto 1fr; column-gap:10px; align-items:baseline; }
  .crew .a p { grid-column:1 / -1; margin:0; color:var(--dim); letter-spacing:0; font-size:11px; line-height:1.4; text-transform:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .crew .a span { color:var(--faint); letter-spacing:.06em; }
  .crew p.home { color:var(--faint); margin:6px 0 0 12px; }
  .crew .a.active { border-left-color:var(--agent); }
  .crew .a.waiting { border-left-color:#8fb4ff; }
  .crew .a b { color:var(--ink); font-weight:500; text-transform:uppercase; letter-spacing:.1em; font-size:10px; }
  .crew .a b i { color:var(--agent); font-style:normal; }
  .crew .a em { color:var(--dim); font-style:normal; font-size:11.5px; letter-spacing:0; line-height:1.45; }
  .crew .a small { color:var(--faint); font-size:10px; }
  .plant { position:fixed; z-index:9; display:flex; align-items:center; gap:10px; transform:translate(16px,-50%); }
  .plant[hidden] { display:none; }
  .plant .kind { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .plant input { font:inherit; font-size:12.5px; color:var(--ink); background:transparent; border:0; padding:4px 2px; width:260px; outline:none; caret-color:#fff; }
  .plant input::placeholder { color:var(--faint); }
  .plant .note { font-size:10px; color:var(--faint); letter-spacing:.04em; white-space:nowrap; }
  .bar #keybtn, .bar #fsbtn, .bar #viewbtn { width:28px; height:28px; padding:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:0; }
  .bar button { pointer-events:auto; font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--dim);
                background:transparent; border:1px solid rgba(226,234,244,.14); padding:6px 11px; cursor:pointer; }
  .bar button:hover { color:var(--ink); border-color:rgba(226,234,244,.3); }
  .bar button.warm { color:var(--agent); border-color:rgba(255,107,59,.35); }
  .bar #back { border:0; padding:6px 2px; color:var(--faint); display:inline-flex; align-items:center; gap:8px; }
  .bar #back::before { content:""; width:18px; height:1px; background:currentColor; transition:width 160ms; }
  .bar #back:hover { color:var(--ink); } .bar #back:hover::before { width:28px; }
  .bar #where { color:var(--faint); } .bar #where b { color:var(--ink); font-weight:500; }
  .bar [hidden] { display:none !important; }
  .bar .sp { flex:1; }
  .bar .live { display:inline-flex; align-items:center; gap:7px; color:var(--faint); }
  .bar .live i { width:6px; height:6px; border-radius:50%; background:var(--agent); box-shadow:0 0 8px var(--agent); }
  .bar .live.off i { background:var(--faint); box-shadow:none; }
  .panel { position:fixed; right:22px; bottom:56px; z-index:8; font-size:10.5px; letter-spacing:.06em; color:var(--faint);
           background:rgba(5,7,11,.95); border:1px solid rgba(226,234,244,.12); padding:12px 14px; width:min(380px, calc(100vw - 44px)); }
  .panel[hidden] { display:none; }
  .panel.answer { width:auto; max-width:340px; padding:9px 11px 10px; }
  .panel.answer .row { display:flex; gap:12px; align-items:center; justify-content:space-between; }
  .panel.answer .row b { color:var(--ink); font-weight:500; letter-spacing:0; font-size:12px; text-transform:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel.answer .acts { display:flex; gap:6px; flex:none; }
  .panel.answer .acts button { font:inherit; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); background:transparent; border:1px solid rgba(226,234,244,.28); padding:4px 8px; cursor:pointer; }
  .panel.answer .acts button.warm { color:var(--agent); border-color:rgba(255,107,59,.4); }
  .panel.answer .acts button:hover { border-color:rgba(226,234,244,.6); }
  .panel.answer .ctx { margin:5px 0 0; color:var(--faint); letter-spacing:0; font-size:11px; line-height:1.45; }
  .panel.answer input { font:inherit; font-size:12px; color:var(--ink); background:transparent; border:0; border-bottom:1px solid rgba(226,234,244,.35); padding:5px 0; width:100%; outline:none; margin-top:6px; caret-color:#fff; }
  .panel.answer .note { margin:4px 0 0; color:var(--agent); font-size:10px; letter-spacing:0; }
  .panel h4 { margin:0 0 10px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400; }
  .panel p { margin:8px 0 0; color:var(--faint); letter-spacing:0; font-size:11px; line-height:1.5; }
  .panel code { color:var(--dim); }
  .key { display:grid; gap:7px; text-transform:uppercase; }
  .key span { display:flex; align-items:center; gap:9px; }
  .key svg { width:24px; height:12px; overflow:visible; flex:none; }
  .form { display:grid; gap:8px; }
  .form select, .form input, .form button { font:inherit; letter-spacing:.04em; color:var(--ink); background:transparent; border:1px solid rgba(226,234,244,.18); padding:7px 9px; }
  .form input { width:100%; } .form input::placeholder { color:var(--faint); }
  .form button { cursor:pointer; color:var(--agent); border-color:rgba(255,107,59,.4); text-transform:uppercase; letter-spacing:.12em; }
  .form button:hover { background:rgba(255,107,59,.08); }
  .form .err { color:var(--agent); }
  .tip { position:fixed; z-index:9; pointer-events:none; max-width:340px; background:rgba(5,7,11,.96);
         border:1px solid rgba(226,234,244,.28); padding:10px 12px; font-size:12.5px; line-height:1.5;
         transform:translate(14px,-50%); opacity:0; transition:opacity 110ms; }
  .tip.on { opacity:1; }
  .tip em { display:block; color:var(--dim); font-style:normal; margin-top:5px; font-size:12px; }
  .tip small { display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:6px; }
  .tip .ch { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin-top:8px; font-size:11px; }
  .tip .ch b { color:var(--faint); font-weight:400; text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; }
  .tip .ch span { color:var(--dim); }
</style>

<canvas id="c"></canvas>
<div class="bar">
  <span class="mark" id="mark" title=""><svg viewBox="0 0 20 20"><path d="M10 1.5 L11.9 8.1 L18.5 10 L11.9 11.9 L10 18.5 L8.1 11.9 L1.5 10 L8.1 8.1 Z"/></svg></span>
  <span class="live off" id="livedot"><i></i><span id="livetext">snapshot</span></span>
  <button id="back" hidden>galaxy</button>
  <span id="where"></span>
  <span class="sp"></span>
  <button id="activitybtn" aria-expanded="false">Activity</button>
  <button id="viewbtn" title="see the star as orbits · v" hidden>◎</button>
  <button id="fsbtn" title="fullscreen · f">⛶</button>
  <button id="keybtn" title="key · k">?</button>
</div>
<div class="panel" id="key" hidden></div>
<div class="panel crew" id="crew" hidden></div>
<div class="panel" id="decide" hidden></div>
<!-- the star you are about to place: an input that sits where you clicked -->
<div class="plant" id="plant" hidden>
  <input id="plantText" placeholder="" autocomplete="off" spellcheck="false" title="enter to place · esc to let it go">
  <span class="note" id="plantNote"></span>
</div>
<div class="tip" id="tip"></div>

<script>
/* ============================================================ language ===
   galaxy        the full view — everything
   star system   a major product capability: a north star and its features
   constellation one feature, opened — its stars are its work
   activity      current coding work; completed sessions live in history
   place a star  add a line to sky.yaml from here
   pin an idea   a loose star, attached to nothing yet
   ======================================================================== */
const RINGS = ["planned","started","built","tests mapped","live"];
const KIND = { done:"done", todo:"to do", open:"open question", explore:"exploration" };
let PROPOSALS = [];
let activityConnected = false;
/* a snapshot has no server to write to, so what you place is kept in this
   browser only — marked as such, and gone if you clear the site's data */
const LOCAL_KEY = () => "skylight-local:" + (NAME||"sky");
/* two ways of seeing a star: the chart (a figure of joined stars) and the orbits
   (its work on rings around it — done closest in, then to do, questions, explorations) */
let VIEW = "chart"; try { VIEW = localStorage.getItem("skylight-view")==="orbit" ? "orbit" : "chart"; } catch {}
function setView(v){ VIEW = v; try { localStorage.setItem("skylight-view", v); } catch {} layoutCache.clear(); hover = null; setChrome(); }
function localStars(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY())||"[]"); } catch { return []; } }
function keepLocal(star){ try { const all = localStars(); all.push(star); localStorage.setItem(LOCAL_KEY(), JSON.stringify(all)); } catch {} }
let SYSTEMS = [], IDEAS = [], AGENTS = [], AREA_OF = {}, ROOT = "", FILE = "sky.yaml", SNAPSHOT = false, GOAL = "", NAME = "";
const angles = new Map();
const CALLS = ["vega","altair","deneb","rigel","spica","mira","sirius","antares","capella","procyon","castor","pollux","alcor","mizar","thuban","lyra","vela","ara"];
const callsign = (id) => { let h = 0; for (const c of id) h = (h*31 + c.charCodeAt(0)) >>> 0; return CALLS[h % CALLS.length]; };

function load(data){
  activityConnected = true;
  const sky = data.sky; ROOT = data.root || ""; FILE = data.file || "sky.yaml"; GOAL = sky.goal || ""; NAME = sky.name || "sky";
  document.title = `${NAME} · Skylight`;
  mark.title = `${sky.name} · ${sky.goal||""}`;
  AREA_OF = {};
  SYSTEMS = sky.stars.map((s,i) => ({
    name:s.name, goal:s.goal,
    areas:s.areas.map((a,j) => {
      const k = s.name+"/"+a.name;
      if (!angles.has(k)) angles.set(k, (j/s.areas.length)*TAU - Math.PI/2 + i*.6);
      for (const p of a.paths) if (!AREA_OF[p]) AREA_OF[p] = { sys:s.name, area:a.name };
      return { name:a.name, about:a.about, ring:a.ring, ticks:a.ticks, files:a.files, lines:a.lines, items:a.items.slice(), sys:null, ang:angles.get(k), agents:[] };
    }),
  }));
  for (const s of SYSTEMS) for (const a of s.areas) a.sys = s;
  IDEAS = sky.ideas.map((t,i) => ({ text:t.text, more:t.more, at:t.at, seed:i*1.7+.3 }));
  if (SNAPSHOT) for (const st of localStars()){
    if (st.kind==="idea") IDEAS.push({ text:st.text, more:"kept in this browser only", at:st.at, seed:IDEAS.length*1.7+.3 });
    else { const ar = SYSTEMS.flatMap(x=>x.areas).find(x=>x.name===st.area); if (ar) ar.items.push({ kind:st.kind, text:st.text, more:"kept in this browser only", at:st.at, src:"this browser" }); }
  }
  PROPOSALS = (sky.proposed||[]).map((p,i) => ({ ...p, seed:i*3.1+1 }));
  AGENTS = data.agents.map((g,i) => {
    const where = g.lastFile ? AREA_OF[g.lastFile] : null;
    const areas = {}; for (const t of g.touched||[]) { const w = AREA_OF[t.file]; if (w) areas[w.area] = (areas[w.area]||0)+1; }
    return { ...g, where, areas, seed:i*2.3+.7, call: callsign(g.id) };
  });
  renderActivity();
  for (const s of SYSTEMS) for (const a of s.areas) a.agents = AGENTS.filter(g => g.state==="active" && g.where && g.where.sys===s.name && g.where.area===a.name);
  // the difference from last time is news: it rides across the sky on a meteor
  const snap = { ring:{}, done:{}, agent:{}, proposals:PROPOSALS.length, pending:0 };
  for (const s of SYSTEMS) for (const a of s.areas) for (const it of a.items) if (it.kind==="open" && it.proposes && it.proposes.length) snap.pending++;
  for (const s of SYSTEMS) for (const a of s.areas){ snap.ring[s.name+"/"+a.name]=a.ring; snap.done[s.name+"/"+a.name]=a.items.filter(i=>i.kind==="done").length; }
  for (const g of AGENTS) snap.agent[g.id] = { state:g.state, phase:g.phase, where:g.where?g.where.area:null, file:g.lastFile };
  snap.run = {}; snap.tests = {}; for (const s of SYSTEMS) for (const a of s.areas) for (const it of a.items) if (it.run){ snap.run[a.name+"/"+it.text] = it.run.status; if (it.run.tests) snap.tests[a.name+"/"+it.text] = it.run.tests.status; }
  if (prevSnap){
    for (const k in snap.ring){ const [sn,an]=k.split("/"); const was=prevSnap.ring[k], now=snap.ring[k];
      if (was!==undefined && now>was) news.push({ text:`${an} · ${RINGS[now]}`, sys:sn, area:an, kind: now===4?"live":"lit" });
      if (prevSnap.done[k]!==undefined && snap.done[k]>prevSnap.done[k]) news.push({ text:`${an} · something landed`, sys:sn, area:an, kind:"landed" }); }
    for (const id in snap.agent){ const w=prevSnap.agent[id], n=snap.agent[id]; if (!w) continue;
      if (w.where!==n.where && n.where) news.push({ text:`${callsign(id)} → ${n.where}`, sys:null, area:n.where, kind:"agent" });
      if (w.state!=="idle" && n.state==="idle") news.push({ text:`${callsign(id)} came home`, kind:"agent" });
      if (w.phase!=="waiting" && n.phase==="waiting") news.push({ text:`${callsign(id)} is waiting on you`, sys:null, area:n.where, kind:"agent" });
      if (w.phase!=="failed" && n.phase==="failed") news.push({ text:`${callsign(id)} failed`, sys:null, area:n.where, kind:"agent" }); }
    if (snap.proposals > prevSnap.proposals) news.push({ text:`${snap.proposals-prevSnap.proposals} proposed`, kind:"proposal" });
    for (const k in snap.run){ const [an,txt]=k.split("/"), w=(prevSnap.run||{})[k], n=snap.run[k]; if (w===n) continue;
      if (n==="running") news.push({ text:`a ship is out · ${txt}`, area:an, kind:"agent" });
      if (n==="done") news.push({ text:`back from ${txt}`, area:an, kind:"agent" });
      if (n==="failed") news.push({ text:`lost at ${txt}`, area:an, kind:"agent" }); }
    for (const k in snap.tests){ const [an,txt]=k.split("/"), w=(prevSnap.tests||{})[k], n=snap.tests[k]; if (w===n) continue;
      const t = SYSTEMS.flatMap(s=>s.areas).find(a=>a.name===an)?.items.find(i=>i.text===txt)?.run?.tests || {};
      if (n==="pass") news.push({ text:`${txt} · holds`, area:an, kind:"lit" });
      if (n==="fail") news.push({ text:`${txt} · breaks ${t.fail!==undefined?t.fail+" test"+(t.fail===1?"":"s"):"the tests"}`, area:an, kind:"agent" }); }
    if (snap.pending > prevSnap.pending){ const d = snap.pending-prevSnap.pending; news.push({ text:`${d} answer${d===1?"":"s"} read · accept or reject`, kind:"proposal" }); }
  }
  if (prevSnap && news.length){ const c = {}; for (const n of news) c[n.kind]=(c[n.kind]||0)+1;
    lastTurn = Object.entries(c).map(([k,v])=>`${v} ${k}`).join(" · "); for (const n of news) if (n.area) recent.set(n.area, performance.now()); }
  prevSnap = snap;
  waiting = queue().length;
  layoutCache.clear();
  if (level.kind==="system") level.sys = SYSTEMS.find(s => s.name===level.sys.name) || SYSTEMS[0];
  if (level.kind==="area"){ level.sys = SYSTEMS.find(s => s.name===level.sys.name) || SYSTEMS[0]; level.area = level.sys.areas.find(a => a.name===level.area.name) || level.sys.areas[0]; opened = level.area; }
  setChrome();
}

/* ============================================================ setup ====== */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip"), back = document.getElementById("back"), where = document.getElementById("where");
const crew = document.getElementById("crew"), decideEl = document.getElementById("decide");
const key = document.getElementById("key"), plant = document.getElementById("plant"), plantText = document.getElementById("plantText"), plantNote = document.getElementById("plantNote"), mark = document.getElementById("mark");
let planting = null;   // { kind, area, x, y } while an input sits on the sky
let W=0,H=0,DPR=1, nodes=[], hover=null, mouse=null, t0=performance.now(), dust=[], meteors=[];
let level = { kind:"all", sys:null, area:null }, prev = null, fade = 1, opened = null;
let motion = 0, lastNow = 0, frameStep = 1;     // the clock everything moves by — it stops while you are reading something; frameStep scales per-frame motion when frames are rare
let prevSnap = null, news = [], sparks = [], trail = [], dawn = 0, dawnFlash = 0, waiting = 0, lastNews = 0, lastAmbient = 0, lastTurn = "", recent = new Map();
/* what waits on a person: proposals, questions, answers whose consequences the
   orchestrator has proposed, and stars that are done but not yet lit */
function queue(){
  const q = [];
  for (const p of PROPOSALS) q.push({ kind:"proposal", text:p.name, more:p.about, p, action:"accept · veto" });
  for (const s of SYSTEMS) for (const a of s.areas){
    // an answered question carrying proposals is not asking to be answered again.
    // it is asking to be settled — a different thing, so a different button.
    for (const it of a.items) if (it.kind==="open") q.push(it.proposes && it.proposes.length
      ? { kind:"reconcile", text:it.text, more:it.more, area:a, item:it, action:"accept · reject" }
      : { kind:"question", text:it.text, more:it.more, area:a, action:"answer" });
    if (a.ring===3) q.push({ kind:"light", text:a.name, more:"tests mapped — verified and live?", area:a, action:"light it" });
  }
  // a ship that came back from a star waits for the person to look at what it did
  for (const s of SYSTEMS) for (const a of s.areas) for (const it of a.items)
    if (it.run && it.run.status==="done") q.push({ kind:"run", text:it.text, more:it.run.said||"", area:a, item:it, action:"accept · revise" });
  // a ship whose turn ended with a question is waiting on you too — that is the same
  // thing as being stuck. two hours, then it is assumed abandoned rather than waiting.
  for (const g of AGENTS) if (g.phase==="waiting" && g.state!=="gone" && Date.now()-(g.noteAt||g.lastAt) < 2*3600e3)
    q.push({ kind:"ship", text:g.note||"waiting for you", more:g.where?`at ${g.where.area}`:"", agent:g, area:g.where?SYSTEMS.flatMap(s=>s.areas).find(a=>a.name===g.where.area):null, action:"waiting for you" });
  return q;
}
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI*2, RR = [1,.82,.64,.46,.28], TILT = .6;
const font = (px,w=400) => `${w} ${px}px "IBM Plex Mono", ui-monospace, monospace`;
const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const KEYS = {
  all: `<span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3.4" fill="#fff"/></svg>a star system — an architecture department. click to open</span>
        <span><svg viewBox="0 0 24 12"><path d="M2 6H14" stroke="rgba(226,234,244,.3)"/><circle cx="16" cy="6" r="2.2" fill="#fff"/></svg>a feature, held on a thread</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2" fill="rgba(226,234,244,.5)"/></svg>a loose idea, attached to nothing yet</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3.4" fill="#ff6b3b"/></svg>the sun at the top is hq — its glow is how much waits on you. click it, from anywhere</span>
        <span><svg viewBox="0 0 24 12"><path d="M20 6L6 11L9 6L6 1Z" fill="none" stroke="#ff6b3b" stroke-width="1"/></svg>an agent. idle ones orbit home; working ones are out at an area</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="none" stroke="#ff6b3b" stroke-dasharray="1.6 1.6"/></svg>double-click empty space to pin an idea where you clicked</span>`,
  system: `<span><svg viewBox="0 0 24 12"><path d="M2 6H14" stroke="rgba(226,234,244,.3)"/><circle cx="16" cy="6" r="3" fill="#fff"/></svg>a feature — click to open its constellation</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2.4" fill="none" stroke="#48525f" stroke-dasharray="1.5 1.5"/></svg>planned, not started</span>
        <span>rings · planned → started → built → tests mapped → live · closer in is more done</span>`,
  hq: `<span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="none" stroke="#ff6b3b" stroke-width="1.3"/></svg>a proposal — accept or veto</span>
        <span><svg viewBox="0 0 24 12"><path d="M16 6 L8 10 L10.5 6 L8 2 Z" fill="none" stroke="#ff6b3b" stroke-width="1"/></svg>a ship that asked you something — answer it in its terminal</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="none" stroke="#7ddc9a" stroke-width="1.3"/></svg>you answered, and the orchestrator read it — accept or reject what it changes</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="none" stroke="#8fb4ff" stroke-width="1.3"/></svg>a question only you can answer</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="#fff"/></svg>tests mapped, not verified — review before marking live</span>
        <span>click anything to answer it, right there · esc or the galaxy line to leave</span>`,
  area: `<span><svg viewBox="0 0 24 12"><path d="M16 6 L8 10 L10.5 6 L8 2 Z" fill="none" stroke="#ff6b3b" stroke-width="1"/></svg>click a star to send a ship · it works on a branch and comes back with a postcard</span>

/* ============================================================ SYSTEM ====

/* ============================================================ SKY ======== */
const ARR = [ [[.24,.34],[.5,.72],[.76,.34]], [[.24,.66],[.5,.30],[.76,.66]], [[.22,.28],[.5,.5],[.78,.72]], [[.78,.28],[.5,.5],[.22,.72]], [[1/6,.5],[.5,.5],[5/6,.5]] ];

/* ============================================================ HQ =========

/* ============================================================ ORBIT ======
   the same star, seen another way: a disc, turning slowly, with its work on
   rings — done closest in, then to do, then questions, then explorations out
   at the edge. distance is state; the figure is the same tilted disc a star

const ORB = { done:.34, todo:.6, open:.82, explore:1 };
function drawOrbit(time, alpha){

  const cx=W/2, cy=H*.5-24, R=Math.min((W-200)/2, (H-210)/2/TILT), here=a.agents.length>0, atAlpha=a.agents.filter(g=>!g.star);

  ctx.save(); ctx.globalCompositeOperation="lighter"; const disc=ctx.createRadialGradient(cx,cy,0,cx,cy,R); disc.addColorStop(0,"rgba(120,150,190,.07)"); disc.addColorStop(.7,"rgba(90,110,150,.025)"); disc.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=disc; ctx.beginPath(); ctx.ellipse(cx,cy,R,R*TILT,0,0,TAU); ctx.fill(); ctx.restore();

    ctx.setLineDash(k==="done"?[]:k==="todo"?[2,7]:k==="open"?[2,7]:[1,9]);
    ctx.strokeStyle = k==="done"?"rgba(226,234,244,.34)":k==="open"?"rgba(143,180,255,.34)":k==="todo"?"rgba(226,234,244,.28)":"rgba(226,234,244,.2)"; ctx.stroke(); ctx.setLineDash([]);

    ctx.textAlign="center"; ctx.font=font(15,500); ctx.fillStyle=here?"#ff6b3b":"#fff"; ctx.fillText(a.name.toUpperCase(), cx, cy+R*ORB.done*TILT+34);
    ctx.font=font(9.5); ctx.fillStyle="rgba(135,146,161,.85)"; ctx.fillText(RINGS[a.ring].toUpperCase(), cx, cy+R*ORB.done*TILT+50);
    if (alpha>0) nodes.push({ x:cx,y:cy,r:22, about:a }); };

  for (const b of bodies){ const p=b.p; if (!p.seen || !p.near) continue; const j = bodies.find(q => q.p.kind==="done" && q.p.text===p.near.split(" | ")[0].trim()); if (!j) continue;

  let starDrawn=false;

    const p=b.p, x=b.x, y=b.y, depth=.6+.4*b.d, tw = REDUCED?1:.9+.1*Math.sin(time*.0021+p.tw);
    if (p.kind==="done"){ bloom(x,y,34*tw*depth,"255,255,255",.4*depth); core(x,y,2.8*tw*depth,`rgba(255,255,255,${.55+.45*b.d})`); }

    else if (p.kind==="open"){ bloom(x,y,22*depth,"143,180,255",.3*depth); ctx.beginPath(); ctx.arc(x,y,3*depth,0,TAU); ctx.strokeStyle=`rgba(143,180,255,${.5+.5*b.d})`; ctx.lineWidth=1.3; ctx.stroke(); }
    else { core(x,y,1.7*depth,`rgba(226,234,244,${.25+.3*b.d})`); }
    starMarks(p, x, y, time, depth);
    const out = Math.cos(b.ang) < 0;
    ctx.font=font(10.5); ctx.textAlign = out?"right":"left";

function pick(x, y){

function wouldPlace(x, y){

  plantText.value = ""; plantNote.textContent = SNAPSHOT ? "kept in this browser only" : "";
  plant.style.left = x + "px"; plant.style.top = y + "px";
  plant.hidden = false; plantText.focus();
}
function unplant(){ planting = null; plant.hidden = true; }
async function commitPlant(){
  if (!planting) return;
  const text = plantText.value.trim(); if (!text){ unplant(); return; }
  const body = { kind: planting.kind, area: planting.area, text, at: [planting.x / W, planting.y / H] };
  if (SNAPSHOT){ keepLocal(body); unplant(); load(window.__SKY__); return; }
  const r = await fetch("/api/place", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  if (!r.ok){ const j = await r.json().catch(()=>({})); plantNote.textContent = j.error || "could not place it"; return; }
  unplant();
}
plantText.addEventListener("keydown", e => { e.stopPropagation(); if (e.key==="Enter") commitPlant(); if (e.key==="Escape") unplant(); });

cv.addEventListener("mousemove",e=>{ const nx=e.clientX, ny=e.clientY;
  if (mouse && !REDUCED && Math.hypot(nx-mouse.x, ny-mouse.y) > 3 && trail.length < 40) trail.push({ x:nx, y:ny, vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6 - .2, life:1 });
  mouse={x:nx,y:ny}; if(REDUCED) draw(performance.now()); });
cv.addEventListener("mouseleave",()=>{ mouse=null; tip.classList.remove("on"); });
async function runGather(){
  if (SNAPSHOT) return;
  decideEl.className = "panel"; leader = null; decideEl.innerHTML = `<h4>sorting</h4><p>an agent is reading the loose ideas…</p>`; decideEl.hidden = false; decideEl.style.right="22px"; decideEl.style.left="auto"; decideEl.style.top="auto"; decideEl.style.bottom="56px";
  const r = await fetch("/api/gather", { method:"POST" }); const j = await r.json().catch(()=>({}));
  decideEl.innerHTML = `<h4>sorted</h4><p>${r.ok ? `${j.proposals.length} proposed feature${j.proposals.length===1?"":"s"} — here, waiting on you` : esc(j.error||"could not sort them")}</p>`;
}
function showDecide(p){
  decideEl.innerHTML = `<h4>proposed · ${esc(p.name)}</h4><p style="color:var(--dim)">${esc(p.about)}</p><p>${p.ideas.map(i=>"· "+esc(i)).join("<br>")}</p>
    <p style="margin-top:12px;display:flex;gap:8px"><button id="acc" style="font:inherit;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:transparent;border:1px solid rgba(226,234,244,.4);padding:6px 11px;cursor:pointer">accept · under ${esc(p.star)}</button><button id="veto" style="font:inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:transparent;border:1px solid rgba(226,234,244,.14);padding:6px 11px;cursor:pointer">veto</button></p>
    <p id="decnote"></p>`;
  decideEl.hidden = false; key.hidden = true; crew.hidden = true;
  const act = async (action) => { if (SNAPSHOT){ document.getElementById("decnote").textContent = "a snapshot — nothing was written"; return; }
    const r = await fetch("/api/proposal", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ name:p.name, action }) });
    if (r.ok) decideEl.hidden = true; else document.getElementById("decnote").textContent = "could not do that"; };
  document.getElementById("acc").addEventListener("click", () => act("accept"));
  document.getElementById("veto").addEventListener("click", () => act("veto"));
}
cv.addEventListener("click",(e)=>{
  if (REDUCED) draw(performance.now());   // no animation loop: draw once so the hit-areas are current
  hover = pick(e.clientX, e.clientY);
  if (planting){ unplant(); return; }
  if (!decideEl.hidden){ decideEl.hidden = true; if (!(hover && hover.desk)) return; }
  if (hover && hover.orch){ if (level.kind!=="hq") go({ kind:"hq" }); return; }
  if (hover && hover.desk){ if (hover.desk.kind==="sort") runGather(); else showDeskItem(hover.desk, hover.x, hover.y); return; }
  if (hover && hover.gather){ runGather(); return; }
  if (hover && hover.item && hover.area && level.kind==="area" && hover.item.kind!=="done" && !SNAPSHOT){
    const it = hover.item, run = it.run && it.run.status!=="accepted" ? it.run : null;
    showDeskItem(run && run.status!=="failed" ? { kind:"run", text:it.text, more:run.said||"", area:hover.area, item:it, action:run.status==="running"?"recall":"accept · revise" }
                                              : { kind:"send", text:it.text, more:it.more, area:hover.area, item:it, action:"send a ship" }, hover.x, hover.y); return; }
  if (hover && hover.sys) go({ kind:"system", sys:hover.sys });
  else if (hover && hover.area && level.kind==="system") go({ kind:"area", sys:level.sys, area:hover.area });
  else if (!hover && level.kind==="hq") up();
  else if (!hover && level.kind!=="all" && outside(e.clientX, e.clientY)) up();
  if(REDUCED) draw(performance.now());
});
cv.addEventListener("dblclick",(e)=>{ if (!pick(e.clientX, e.clientY) && !planting && e.clientY > 56 && !outside(e.clientX, e.clientY)) plantAt(e.clientX, e.clientY); });
back.addEventListener("click",up);
document.getElementById("keybtn").addEventListener("click",()=>{ key.hidden=!key.hidden; unplant(); });
function fullscreen(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
document.getElementById("fsbtn").addEventListener("click", fullscreen);
const viewbtn = document.getElementById("viewbtn");
viewbtn.addEventListener("click", () => setView(VIEW==="orbit" ? "chart" : "orbit"));
mark.addEventListener("mouseenter",()=>{ tip.innerHTML = `<span style="color:#fff">${esc(NAME)}</span><em>${esc(GOAL||"no goal set — add goal: to sky.yaml")}</em><small>${SYSTEMS.length} systems · ${SYSTEMS.reduce((n,s)=>n+s.areas.length,0)} areas · ${SYSTEMS.reduce((n,s)=>n+s.areas.filter(a=>a.ring===4).length,0)} live · ${AGENTS.filter(g=>g.state==="active").length} working</small>`;
  tip.style.transform="translate(0,0)"; tip.style.left="22px"; tip.style.top="50px"; tip.classList.add("on"); });
mark.addEventListener("mouseleave",()=>tip.classList.remove("on"));
addEventListener("keydown",e=>{ if (e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.key==="Escape"){ if(!key.hidden||!crew.hidden||!decideEl.hidden||planting){ key.hidden=true; crew.hidden=true; decideEl.hidden=true; unplant(); } else up(); } if(e.key==="k") key.hidden=!key.hidden; if(e.key==="f") fullscreen(); if(e.key==="v" && level.kind==="area") setView(VIEW==="orbit" ? "chart" : "orbit"); });
addEventListener("resize",()=>{ resize(); if(REDUCED) draw(performance.now()); });

const dot = document.getElementById("livedot"), livetext = document.getElementById("livetext");
const stamp = (t) => { const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString([], { month:"short", day:"numeric" }) + " " + hm; };
if (window.__SKY__){ SNAPSHOT = true; load(window.__SKY__); livetext.textContent = stamp(window.__SKY__.at); dot.title = "a snapshot, taken then"; }
else {
  fetch("/api/sky").then(r=>r.json()).then((d) => { load(d); livetext.textContent = stamp(d.at); }).catch(disconnectActivity);
  const es = new EventSource("/events");
  es.addEventListener("sky", (e) => { const d = JSON.parse(e.data); load(d); dot.classList.remove("off"); livetext.textContent = stamp(d.at); dot.title = "live · last change"; });
  es.onerror = disconnectActivity;
}
go({ kind:"all" }); prev=null; fade=1; seedDust(); resize(); requestAnimationFrame(draw);
</script>
