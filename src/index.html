<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skylight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --void:#05070b; --ink:#e2eaf4; --dim:#8792a1; --faint:#48525f; --agent:#ff6b3b; --q:#8fb4ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--void); color:var(--ink); overflow:hidden; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  canvas.hand { cursor:pointer; }
  .bar { position:fixed; top:0; left:0; right:0; z-index:8; display:flex; align-items:center; gap:14px; padding:15px 22px;
         font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); pointer-events:none; }
  .bar b { color:var(--ink); font-weight:500; }
  .bar .mark { pointer-events:auto; width:22px; height:22px; display:inline-flex; cursor:default; }
  .bar .mark svg { width:22px; height:22px; fill:#fff; filter:drop-shadow(0 0 6px rgba(255,255,255,.6)); }
  .panel.crew { right:auto; top:auto; left:22px; bottom:118px; width:min(400px, calc(100vw - 44px)); }
  .crew .a { display:grid; gap:3px; padding:8px 0 8px 12px; border-left:1px solid rgba(226,234,244,.12); margin-bottom:6px; }
  .crew .a.active { border-left-color:var(--agent); }
  .crew .a b { color:var(--ink); font-weight:500; text-transform:uppercase; letter-spacing:.1em; font-size:10px; }
  .crew .a b i { color:var(--agent); font-style:normal; }
  .crew .a em { color:var(--dim); font-style:normal; font-size:11.5px; letter-spacing:0; line-height:1.45; }
  .crew .a small { color:var(--faint); font-size:10px; }
  .plant { position:fixed; z-index:9; display:flex; align-items:center; gap:10px; transform:translate(16px,-50%); }
  .plant[hidden] { display:none; }
  .plant .kind { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .plant input { font:inherit; font-size:12.5px; color:var(--ink); background:rgba(5,7,11,.85); border:0; border-bottom:1px solid rgba(226,234,244,.5); padding:5px 2px; width:280px; outline:none; }
  .plant input::placeholder { color:var(--faint); }
  .plant .note { font-size:10px; color:var(--faint); letter-spacing:.04em; white-space:nowrap; }
  .bar #keybtn { width:28px; height:28px; padding:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:0; }
  .bar button { pointer-events:auto; font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--dim);
                background:transparent; border:1px solid rgba(226,234,244,.14); padding:6px 11px; cursor:pointer; }
  .bar button:hover { color:var(--ink); border-color:rgba(226,234,244,.3); }
  .bar button.warm { color:var(--agent); border-color:rgba(255,107,59,.35); }
  .bar #back { border:0; padding:6px 2px; color:var(--faint); display:inline-flex; align-items:center; gap:8px; }
  .bar #back::before { content:""; width:18px; height:1px; background:currentColor; transition:width 160ms; }
  .bar #back:hover { color:var(--ink); } .bar #back:hover::before { width:28px; }
  .bar #where { color:var(--faint); } .bar #where b { color:var(--ink); font-weight:500; }
  .bar [hidden] { display:none !important; }
  .bar .sp { flex:1; }
  .bar .live { display:inline-flex; align-items:center; gap:7px; color:var(--faint); }
  .bar .live i { width:6px; height:6px; border-radius:50%; background:var(--agent); box-shadow:0 0 8px var(--agent); }
  .bar .live.off i { background:var(--faint); box-shadow:none; }
  .panel { position:fixed; right:22px; top:52px; z-index:8; font-size:10.5px; letter-spacing:.06em; color:var(--faint);
           background:rgba(5,7,11,.95); border:1px solid rgba(226,234,244,.12); padding:12px 14px; width:min(380px, calc(100vw - 44px)); }
  .panel[hidden] { display:none; }
  .panel h4 { margin:0 0 10px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400; }
  .panel p { margin:8px 0 0; color:var(--faint); letter-spacing:0; font-size:11px; line-height:1.5; }
  .panel code { color:var(--dim); }
  .key { display:grid; gap:7px; text-transform:uppercase; }
  .key span { display:flex; align-items:center; gap:9px; }
  .key svg { width:24px; height:12px; overflow:visible; flex:none; }
  .form { display:grid; gap:8px; }
  .form select, .form input, .form button { font:inherit; letter-spacing:.04em; color:var(--ink); background:transparent; border:1px solid rgba(226,234,244,.18); padding:7px 9px; }
  .form input { width:100%; } .form input::placeholder { color:var(--faint); }
  .form button { cursor:pointer; color:var(--agent); border-color:rgba(255,107,59,.4); text-transform:uppercase; letter-spacing:.12em; }
  .form button:hover { background:rgba(255,107,59,.08); }
  .form .err { color:var(--agent); }
  .tip { position:fixed; z-index:9; pointer-events:none; max-width:340px; background:rgba(5,7,11,.96);
         border:1px solid rgba(226,234,244,.28); padding:10px 12px; font-size:12.5px; line-height:1.5;
         transform:translate(14px,-50%); opacity:0; transition:opacity 110ms; }
  .tip.on { opacity:1; }
  .tip em { display:block; color:var(--dim); font-style:normal; margin-top:5px; font-size:12px; }
  .tip small { display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:6px; }
  .tip .ch { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin-top:8px; font-size:11px; }
  .tip .ch b { color:var(--faint); font-weight:400; text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; }
  .tip .ch span { color:var(--dim); }
</style>

<canvas id="c"></canvas>
<div class="bar">
  <span class="mark" id="mark" title=""><svg viewBox="0 0 20 20"><path d="M10 1.5 L11.9 8.1 L18.5 10 L11.9 11.9 L10 18.5 L8.1 11.9 L1.5 10 L8.1 8.1 Z"/></svg></span>
  <span class="live off" id="livedot"><i></i><span id="livetext">snapshot</span></span>
  <button id="back" hidden>sky</button>
  <span id="where"></span>
  <span class="sp"></span>
  <button id="keybtn" title="key · k">?</button>
</div>
<div class="panel" id="key" hidden></div>
<div class="panel crew" id="crew" hidden></div>
<!-- the star you are about to place: an input that sits where you clicked -->
<div class="plant" id="plant" hidden>
  <span class="kind" id="plantKind"></span>
  <input id="plantText" placeholder="what is it?" autocomplete="off" spellcheck="false">
  <span class="note" id="plantNote"></span>
</div>
<div class="tip" id="tip"></div>

<script>
/* ============================================================ language ===
   sky           everything
   system        one north star and the areas held around it   (FRONTEND…)
   constellation one area, opened — its stars are its work
   orchestrator  the orange star the agents come home to
   place a star  add a line to sky.yaml from here
   pin an idea   a loose star, attached to nothing yet
   ======================================================================== */
const RINGS = ["planned","started","built","tested","live"];
const KIND = { done:"done", todo:"to do", open:"open question", explore:"exploration" };
let SYSTEMS = [], IDEAS = [], AGENTS = [], AREA_OF = {}, ROOT = "", FILE = "sky.yaml", SNAPSHOT = false, GOAL = "", NAME = "";
const angles = new Map();

function load(data){
  const sky = data.sky; ROOT = data.root || ""; FILE = data.file || "sky.yaml"; GOAL = sky.goal || ""; NAME = sky.name || "sky";
  mark.title = `${sky.name} · ${sky.goal||""}`;
  SYSTEMS = sky.stars.map((s,i) => ({
    name:s.name, goal:s.goal,
    areas:s.areas.map((a,j) => {
      const k = s.name+"/"+a.name;
      if (!angles.has(k)) angles.set(k, (j/s.areas.length)*TAU - Math.PI/2 + i*.6);
      for (const p of a.paths) AREA_OF[p] = { sys:s.name, area:a.name };
      return { name:a.name, about:a.about, ring:a.ring, ticks:a.ticks, files:a.files, lines:a.lines, items:a.items.slice(), sys:null, ang:angles.get(k), agents:[] };
    }),
  }));
  for (const s of SYSTEMS) for (const a of s.areas) a.sys = s;
  IDEAS = sky.ideas.map((t,i) => ({ text:t.text, more:t.more, at:t.at, seed:i*1.7+.3 }));
  AGENTS = data.agents.map((g,i) => {
    const where = g.lastFile ? AREA_OF[g.lastFile] : null;
    const areas = {}; for (const t of g.touched||[]) { const w = AREA_OF[t.file]; if (w) areas[w.area] = (areas[w.area]||0)+1; }
    return { ...g, where, areas, seed:i*2.3+.7 };
  });
  for (const s of SYSTEMS) for (const a of s.areas) a.agents = AGENTS.filter(g => g.state==="active" && g.where && g.where.sys===s.name && g.where.area===a.name);
  layoutCache.clear();
  if (level.kind==="system") level.sys = SYSTEMS.find(s => s.name===level.sys.name) || SYSTEMS[0];
  if (level.kind==="area"){ level.sys = SYSTEMS.find(s => s.name===level.sys.name) || SYSTEMS[0]; level.area = level.sys.areas.find(a => a.name===level.area.name) || level.sys.areas[0]; opened = level.area; }
  setChrome();
}

/* ============================================================ setup ====== */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip"), back = document.getElementById("back"), where = document.getElementById("where");
const crew = document.getElementById("crew");
const key = document.getElementById("key"), plant = document.getElementById("plant"), plantKind = document.getElementById("plantKind"), plantText = document.getElementById("plantText"), plantNote = document.getElementById("plantNote"), mark = document.getElementById("mark");
let planting = null;   // { kind, area, x, y } while an input sits on the sky
let W=0,H=0,DPR=1, nodes=[], hover=null, mouse=null, t0=performance.now(), dust=[], meteors=[];
let level = { kind:"all", sys:null, area:null }, prev = null, fade = 1, opened = null;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI*2, RR = [1,.82,.64,.46,.28], TILT = .6;
const font = (px,w=400) => `${w} ${px}px "IBM Plex Mono", ui-monospace, monospace`;
const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const KEYS = {
  all: `<span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3.4" fill="#fff"/></svg>a system — a north star and its areas. click to open</span>
        <span><svg viewBox="0 0 24 12"><path d="M2 6H14" stroke="rgba(226,234,244,.3)"/><circle cx="16" cy="6" r="2.2" fill="#fff"/></svg>an area, held on a thread</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2" fill="rgba(226,234,244,.5)"/></svg>a loose idea, attached to nothing yet</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3.4" fill="#ff6b3b"/></svg>the orchestrator — where agents come home</span>
        <span><svg viewBox="0 0 24 12"><path d="M20 6L6 11L9 6L6 1Z" fill="none" stroke="#ff6b3b" stroke-width="1"/></svg>an agent. idle ones orbit home; working ones are out at an area</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="none" stroke="#ff6b3b" stroke-dasharray="1.6 1.6"/></svg>double-click empty sky to pin an idea where you clicked</span>`,
  system: `<span><svg viewBox="0 0 24 12"><path d="M2 6H14" stroke="rgba(226,234,244,.3)"/><circle cx="16" cy="6" r="3" fill="#fff"/></svg>an area — click to open its constellation</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2.4" fill="none" stroke="#48525f" stroke-dasharray="1.5 1.5"/></svg>planned, not started</span>
        <span>rings · planned → started → built → tested → live · closer in is more done</span>`,
  area: `<span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="#fff"/></svg>done</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2.6" fill="none" stroke="rgba(226,234,244,.55)" stroke-dasharray="1.5 1.5"/></svg>to do</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2.8" fill="none" stroke="#8fb4ff" stroke-width="1.3"/></svg>open question</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="2" fill="rgba(226,234,244,.35)"/></svg>exploration — a branch, or a path not taken</span>
        <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="3" fill="none" stroke="#ff6b3b" stroke-dasharray="1.6 1.6"/></svg>double-click empty space to place a star — above is to do, left a question, right an exploration, below done · click empty space to go back</span>`,
};
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layoutSky(); layoutCache.clear(); }
function seedDust(){ let s=77; const r=()=> (s=(s*16807)%2147483647)/2147483647; dust=Array.from({length:300},()=>({x:r(),y:r(),r:r()*.8+.2,a:r()*.35+.05,tw:r()*TAU})); }
function bloom(x,y,r,rgb,a){
  if (!Number.isFinite(x)||!Number.isFinite(y)||!(r>0)) return;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  let g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${rgb},${a})`); g.addColorStop(.35,`rgba(${rgb},${a*.28})`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  g=ctx.createRadialGradient(x,y,0,x,y,r*.28); g.addColorStop(0,`rgba(${rgb},${a*1.4})`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*.28,0,TAU); ctx.fill(); ctx.restore();
}
function flare(x,y,len,rgb,a){
  if (!Number.isFinite(x)||!Number.isFinite(y)) return;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for (const [dx,dy] of [[1,0],[0,1]]){ const g=ctx.createLinearGradient(x-dx*len,y-dy*len,x+dx*len,y+dy*len);
    g.addColorStop(0,`rgba(${rgb},0)`); g.addColorStop(.5,`rgba(${rgb},${a})`); g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.strokeStyle=g; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x-dx*len,y-dy*len); ctx.lineTo(x+dx*len,y+dy*len); ctx.stroke(); }
  ctx.restore();
}
function core(x,y,r,color){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=color; ctx.fill(); }
function drawDust(time){
  for (const d of dust){ const tw=REDUCED?1:.7+.3*Math.sin(time*.0011+d.tw);
    ctx.beginPath(); ctx.arc(d.x*W,d.y*H,d.r,0,TAU); ctx.fillStyle=`rgba(226,234,244,${d.a*tw})`; ctx.fill(); }
  if (!REDUCED && Math.random() < .004 && meteors.length < 2) meteors.push({ x:Math.random()*W, y:Math.random()*H*.5, vx:6+Math.random()*5, vy:3+Math.random()*3, life:1 });
  for (const m of meteors){ m.x+=m.vx; m.y+=m.vy; m.life-=.022;
    const g=ctx.createLinearGradient(m.x-m.vx*10,m.y-m.vy*10,m.x,m.y); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,`rgba(255,255,255,${.7*m.life})`);
    ctx.strokeStyle=g; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(m.x-m.vx*10,m.y-m.vy*10); ctx.lineTo(m.x,m.y); ctx.stroke(); }
  meteors = meteors.filter(m => m.life > 0);
}
/* a ship: hairline wireframe, nose along its heading */
function ship(x,y,heading,size,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(heading); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(size,0); ctx.lineTo(-size*.75,size*.62); ctx.lineTo(-size*.35,0); ctx.lineTo(-size*.75,-size*.62); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-size*.35,0); ctx.lineTo(size*.2,0); ctx.stroke(); ctx.restore();
}

/* ============================================================ SYSTEM ====
   A tilted disc, turning very slowly — the illusion of a thing in space. Rings
   are ellipses; a body at the back of the disc is smaller and dimmer than one
   at the front. Only the working agent moves fast. */
const ROT = REDUCED ? 0 : .000045;
function proj(cx,cy,r,ang,time){ const a=ang+time*ROT; const d=(Math.sin(a)+1)/2; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r*TILT, d, a]; }
function drawSystem(s, cx, cy, R, detailed, time, alpha, clickable){
  const hovered = mouse && Math.hypot(mouse.x-cx, (mouse.y-cy)/TILT) < R*1.05;
  RR.forEach((f,k) => { if (!k) return;
    ctx.beginPath(); ctx.ellipse(cx,cy,R*f,R*f*TILT,0,0,TAU); ctx.strokeStyle=detailed?"rgba(226,234,244,.1)":"rgba(226,234,244,.06)";
    ctx.lineWidth=1; ctx.setLineDash([2,7]); ctx.stroke(); ctx.setLineDash([]);
    if (detailed && mouse){ const dr = Math.abs(Math.hypot(mouse.x-cx,(mouse.y-cy)/TILT) - R*f);
      if (dr < R*.09){ ctx.font=font(9); ctx.textAlign="right"; ctx.fillStyle="rgba(135,146,161,.75)"; ctx.fillText(RINGS[k].toUpperCase(), cx-R*f-8, cy+3); } }
  });
  // the back half first, so the front draws over it
  const bodies = s.areas.map(a => { const [x,y,d,ang] = proj(cx,cy,R*RR[a.ring],a.ang,time); return { a,x,y,d,ang }; }).sort((p,q)=>p.d-q.d);
  const star = () => { const pulse=REDUCED?1:.95+.05*Math.sin(time*.0011+cx*.01);
    bloom(cx,cy,Math.max(50,R*.3)*pulse,"255,255,255",hovered&&clickable?.4:.28); flare(cx,cy,R*.55,"255,255,255",.22); core(cx,cy,3.2,"#fff"); };
  let starDrawn = false;
  for (const b of bodies){
    if (!starDrawn && b.d > .5){ star(); starDrawn = true; }
    const a=b.a, here=a.agents.length>0, planned=a.ring===0, depth=.6+.4*b.d;
    if (here && level.kind!=="area" && !REDUCED) a.ang += .0007;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle = here?`rgba(255,107,59,${.7*depth})`:planned?"rgba(226,234,244,.07)":`rgba(226,234,244,${(detailed?.26:.16)*depth})`; ctx.lineWidth=here?1.4:1; ctx.stroke();
    if (planned){ ctx.beginPath(); ctx.arc(b.x,b.y,2.4,0,TAU); ctx.strokeStyle="rgba(226,234,244,.3)"; ctx.lineWidth=1; ctx.setLineDash([1.5,1.5]); ctx.stroke(); ctx.setLineDash([]); }
    else if (here){
      const heading = Math.atan2(Math.cos(b.ang)*TILT, -Math.sin(b.ang)); // tangent to the ellipse
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for (let k=1;k<=12;k++){ const [tx,ty]=proj(cx,cy,R*RR[a.ring],a.ang-k*.045,time); ctx.beginPath(); ctx.arc(tx,ty,2.6*(1-k/12),0,TAU); ctx.fillStyle=`rgba(255,107,59,${.45*(1-k/12)})`; ctx.fill(); }
      ctx.restore();
      bloom(b.x,b.y,detailed?34:22,"255,107,59",.6); ship(b.x,b.y,heading,detailed?9:6,"#ff6b3b",1);
      a.agents.forEach((g,i) => nodes.push({ x:b.x, y:b.y, r:16, agent:g }));
    }
    else { bloom(b.x,b.y,(12+a.ring*3)*depth,"255,255,255",(.08+a.ring*.07)*depth); core(b.x,b.y,((detailed?2.4:1.8)+a.ring*.25)*depth,`rgba(255,255,255,${.6+.4*b.d})`); }
    if (detailed){
      const out = Math.cos(b.ang) < 0;
      ctx.font=font(10.5,here?500:400); ctx.textAlign=out?"right":"left";
      ctx.fillStyle = here?"#ff6b3b":planned?"rgba(72,82,95,.95)":`rgba(226,234,244,${.45+.45*b.d})`;
      ctx.fillText((a.name+(here?` · ${a.agents.length>1?a.agents.length+" agents":"agent"}`:"")).toUpperCase(), b.x+(out?-11:11), b.y+3.5);
      if (alpha>.5 && !here) nodes.push({ x:b.x,y:b.y,r:16,area:a });
      else if (alpha>.5) nodes.push({ x:b.x,y:b.y,r:26,area:a });
    }
  }
  if (!starDrawn) star();
  ctx.textAlign="center"; ctx.font=font(detailed?14:13,500); ctx.fillStyle = hovered&&clickable ? "#fff" : "rgba(255,255,255,.9)";
  ctx.fillText(s.name.toUpperCase(), cx, cy+R*TILT+22);
  if (!detailed && clickable && alpha>.5) nodes.push({ x:cx, y:cy, r:R*1.05, sys:s, ell:true });
}

/* ============================================================ ORCHESTRATOR
   The orange star the agents come home to. Idle ships orbit it; a working
   ship is out at its area. Click a ship for its character. */
function drawOrchestrator(time, alpha, big){
  const R = 58, cx = W/2, cy = 64 + (H-64)/2;
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.ellipse(cx,cy,R,R*TILT,0,0,TAU); ctx.strokeStyle="rgba(255,107,59,.14)"; ctx.setLineDash([2,7]); ctx.stroke(); ctx.setLineDash([]);
  const pulse=REDUCED?1:.94+.06*Math.sin(time*.0013);
  bloom(cx,cy,(big?40:32)*pulse,"255,107,59",.5); flare(cx,cy,R*.6,"255,150,110",.35); core(cx,cy,2.6,"#ff6b3b");
  const idle = AGENTS.filter(g => g.state==="idle" || (g.state==="active" && !g.where));
  const working = AGENTS.filter(g => g.state==="active" && g.where).length;
  ctx.textAlign="center"; ctx.font=font(9); ctx.fillStyle="rgba(255,107,59,.55)"; ctx.fillText(`${working} out · ${idle.length} home`, cx, cy+R*TILT+16);
  if (alpha>.5) nodes.push({ x:cx, y:cy, r:R*.6, orch:true, ell:true });
  idle.forEach((g,i) => {

/* ============================================================ SKY ======== */
const ARR = [ [[.24,.70],[.5,.26],[.76,.70]], [[.24,.30],[.5,.74],[.76,.30]], [[.18,.5],[.5,.22],[.82,.5]], [[.18,.5],[.5,.78],[.82,.5]], [[1/6,.5],[.5,.5],[5/6,.5]] ];
let placed = { R:0, centers:[] };
function layoutSky(){
  const n = Math.max(1, SYSTEMS.length||3), top=64, pad=40, head=44, w=W, h=H-top; let best=null;
  const arrs = n===3 ? ARR : [Array.from({length:n},(_,i)=>[(i+.5)/n,.5])];
  for (const arr of arrs){
    const c = arr.map(([x,y]) => ({ x:x*w, y:top+y*h })); let R = Infinity;
    for (const k of c) R = Math.min(R, k.x, w-k.x, (k.y-top)/TILT, (top+h-k.y-head)/TILT);

    const mx = w/2, my = top + h/2;

}
function drawAll(time, alpha){

  IDEAS.forEach((id,i) => {
    const bx = id.at ? id.at[0]*W : W*(.08+.66*((i*.618)%1)), by = id.at ? id.at[1]*H : 90 + (H-150)*((i*.382+.2)%1);
    const x = bx + Math.sin(time*.0002+id.seed)*(id.at?6:18), y = by + Math.cos(time*.00017+id.seed)*(id.at?5:14);
    const tw = REDUCED?1:.8+.2*Math.sin(time*.002+id.seed);
    bloom(x,y,10*tw,"226,234,244",.18); core(x,y,1.8,"rgba(226,234,244,.7)");

}
function drawOne(s, time, alpha){ ctx.globalAlpha=alpha; drawSystem(s, W/2, H/2+30, Math.min((W-120)/2,(H-64)/2/TILT)-80, true, time, alpha, false); ctx.globalAlpha=1; }

/* ============================================================ AREA ====== */
const layoutCache = new Map();
function constellation(a){
  const k = a.sys.name+"/"+a.name+"|"+W+"|"+H;
  if (layoutCache.has(k)) return layoutCache.get(k);
  const items = a.items.map((it,i)=>({...it, i}));
  let seed = 1000 + a.name.length*97 + a.name.charCodeAt(0);
  const rnd = () => (seed=(seed*16807)%2147483647)/2147483647;
  const cx=W/2, cy=H*.58, Rx=Math.min(W*.44,740), Ry=Math.min(H*.36,420);
  const alpha = { kind:"alpha", text:a.name, x:cx, y:cy, i:-1, tw:0 };
  const pts = items.map((it,j) => {
    const g = j*2.39996 + rnd()*.6, rr = .45 + rnd()*.55;
    let x = cx + Math.cos(g)*Rx*rr, y = cy + Math.sin(g)*Ry*rr;
    if (it.kind==="todo")    { y = cy - Ry*(.55 + rnd()*.55); x = cx + (rnd()-.5)*Rx*1.1; }
    if (it.kind==="open")    { x = cx - Rx*(.85 + rnd()*.35); y = cy + (rnd()-.5)*Ry*1.2; }
    if (it.kind==="explore") { x = cx + Rx*(.95 + rnd()*.35); y = cy + (rnd()-.5)*Ry*1.4; }
    if (it.at){ x = it.at[0]*W; y = it.at[1]*H; }
    return { ...it, x, y, tw:rnd()*TAU, fixed:!!it.at };
  });
  const MIN = 96;
  for (let iter=0; iter<60; iter++){
    for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++){
      const p=pts[i], q=pts[j], dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy)||.01;
      if (d < MIN){ const push=(MIN-d)/2, ux=dx/d, uy=dy/d; if(!p.fixed){p.x-=ux*push; p.y-=uy*push;} if(!q.fixed){q.x+=ux*push; q.y+=uy*push;} } }
    for (const p of pts){ if (p.fixed) continue; const d=Math.hypot(p.x-cx,p.y-cy); if (d<MIN){ const k=(MIN-d)/d; p.x+=(p.x-cx)*k; p.y+=(p.y-cy)*k; } }
  }

    const L=150, Rm=300, T=150, B=70;
    let x0=Math.min(cx,...pts.map(p=>p.x)), x1=Math.max(cx,...pts.map(p=>p.x)), y0=Math.min(cy,...pts.map(p=>p.y)), y1=Math.max(cy,...pts.map(p=>p.y));
    const sc=Math.min(1,(W-L-Rm)/Math.max(1,x1-x0),(H-T-B)/Math.max(1,y1-y0));
    for (const p of pts){ if (p.fixed) continue; p.x = cx + (p.x-cx)*sc; p.y = cy + (p.y-cy)*sc; }
    x0=Math.min(cx,...pts.map(p=>p.x)); x1=Math.max(cx,...pts.map(p=>p.x)); y0=Math.min(cy,...pts.map(p=>p.y)); y1=Math.max(cy,...pts.map(p=>p.y));
    const dx = x0 < L ? L-x0 : x1 > W-Rm ? (W-Rm)-x1 : 0, dy = y0 < T ? T-y0 : y1 > H-B ? (H-B)-y1 : 0;
    for (const p of [alpha,...pts]){ if (p.fixed) continue; p.x+=dx; p.y+=dy; }
  }
  const joined = [alpha, ...pts.filter(p=>p.kind!=="explore")];
  const inTree = [joined[0]], edges = [];
  while (inTree.length < joined.length){
    let best=null;
    for (const u of inTree) for (const v of joined){ if (inTree.includes(v)) continue;
      const d = Math.hypot(u.x-v.x, u.y-v.y) * (v.kind==="open"?1.35:1); if (!best || d<best.d) best={u,v,d}; }
    inTree.push(best.v); edges.push([best.u,best.v]);
  }
  const side = (p) => p.x < alpha.x - 40 ? -1 : 1;
  const box = (p) => { const w = p.text.length*6.6+14; const x0 = side(p)>0 ? p.x+10 : p.x-10-w; return { x0, x1:x0+w }; };
  for (const p of pts) p.ldy = 0;
  const order = [...pts].sort((a,b)=>a.y-b.y);
  for (let i=0;i<order.length;i++) for (let j=0;j<i;j++){
    const a=box(order[i]), b=box(order[j]);
    if (a.x0 < b.x1 && b.x0 < a.x1){ const ay=order[i].y+order[i].ldy, by=order[j].y+order[j].ldy; if (Math.abs(ay-by) < 15) order[i].ldy += (by+15)-ay; }
  }

}
function drawTracker(time, alpha){
  const a=opened, C=constellation(a), nx=C.cx, ny=96;

  const wob = (p) => (REDUCED || !Number.isFinite(p.tw)) ? [p.x,p.y] : [p.x+Math.sin(time*.0007+p.tw)*2.5, p.y+Math.cos(time*.0009+p.tw)*2.5];

  ctx.save(); ctx.globalCompositeOperation="lighter";
  const cloud = (x,y,r,al) => { const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(120,150,190,${al})`); g.addColorStop(.6,`rgba(90,110,150,${al*.35})`); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); };

  ctx.restore();

  ctx.textAlign="center"; ctx.font=font(10.5,500); ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText(a.sys.name.toUpperCase(), nx, ny+22);
  for (const [u,v] of C.edges){
    const [ux,uy]=wob(u), [vx,vy]=wob(v);
    const lit = (u.kind==="done"||u.kind==="alpha") && (v.kind==="done"||v.kind==="alpha"), open = u.kind==="open"||v.kind==="open";
    if (lit){ ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.beginPath(); ctx.moveTo(ux,uy); ctx.lineTo(vx,vy); ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=4; ctx.stroke(); ctx.restore(); }
    ctx.beginPath(); ctx.moveTo(ux,uy); ctx.lineTo(vx,vy); ctx.setLineDash(lit?[]:[3,5]);
    ctx.strokeStyle = lit ? "rgba(255,255,255,.85)" : open ? "rgba(143,180,255,.5)" : "rgba(226,234,244,.4)"; ctx.lineWidth = lit ? 1.3 : 1; ctx.stroke(); ctx.setLineDash([]);

      bloom(x,y,96,here?"255,107,59":"255,255,255",here?.55:.42); flare(x,y,150,here?"255,150,110":"255,255,255",.5); core(x,y,4.4,here?"#ff6b3b":"#fff");

      ctx.textAlign="center"; ctx.font=font(15,500); ctx.fillStyle=here?"#ff6b3b":"#fff"; ctx.fillText(a.name.toUpperCase(), x, y+44);
      ctx.font=font(9.5); ctx.fillStyle="rgba(135,146,161,.85)"; ctx.fillText(RINGS[a.ring].toUpperCase(), x, y+60);
      if (alpha>.5) nodes.push({ x,y,r:20, about:a });

    }
    if (p.kind==="done"){ bloom(x,y,40*tw,"255,255,255",.42); flare(x,y,34,"255,255,255",.45); core(x,y,3*tw,"#fff"); }
    else if (p.kind==="todo"){ bloom(x,y,18,"255,255,255",.10); ctx.beginPath(); ctx.arc(x,y,3.2,0,TAU); ctx.strokeStyle="rgba(226,234,244,.7)"; ctx.lineWidth=1; ctx.setLineDash([1.6,1.6]); ctx.stroke(); ctx.setLineDash([]); }
    else if (p.kind==="open"){ bloom(x,y,26,"143,180,255",.35); ctx.beginPath(); ctx.arc(x,y,3.2,0,TAU); ctx.strokeStyle="#8fb4ff"; ctx.lineWidth=1.3; ctx.stroke(); }
    else { bloom(x,y,10,"226,234,244",.12); core(x,y,1.8,"rgba(226,234,244,.5)"); }
    const left = x < C.cx - 40;
    ctx.font=font(10.5); ctx.textAlign = left?"right":"left";
    ctx.fillStyle = p.kind==="done"?"rgba(226,234,244,.9)":p.kind==="open"?"#8fb4ff":p.kind==="todo"?"rgba(226,234,244,.62)":"rgba(226,234,244,.42)";
    ctx.fillText(p.text, x+(left?-10:10), y+3.3+(p.ldy||0));

/* ============================================================ loop ======= */
function pick(x, y){
  let best=null, bd=1e9;
  for (const n of nodes){ const d = n.ell ? Math.hypot(n.x-x,(n.y-y)/TILT) : Math.hypot(n.x-x,n.y-y); if (d<n.r && d<bd){ bd=d; best=n; } }

function drawLevel(L, time, alpha){ if (L.kind==="all") drawAll(time, alpha); else if (L.kind==="system") drawOne(L.sys, time, alpha); else { opened = L.area; drawTracker(time, alpha); } }
function draw(now){
  const time=now-t0; fade += (1-fade)*(REDUCED?1:.12);

  if (prev && fade<.995) drawLevel(prev, time, 1-fade);
  ctx.save(); const sc = .96+.04*fade; ctx.translate(W/2*(1-sc), H/2*(1-sc)); ctx.scale(sc,sc); drawLevel(level, time, fade); ctx.restore();

  // empty sky under the cursor: show the star that would land here, and what kind it would be
  const would = (!planting && mouse && !hover && mouse.y > 56 && fade > .9) ? wouldPlace(mouse.x, mouse.y) : null;
  if (would){ ctx.beginPath(); ctx.arc(mouse.x,mouse.y,3,0,TAU); ctx.strokeStyle="rgba(226,234,244,.35)"; ctx.lineWidth=1; ctx.setLineDash([1.6,1.6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.font=font(9); ctx.textAlign="left"; ctx.fillStyle="rgba(226,234,244,.35)"; ctx.fillText(("double-click · "+would.label).toUpperCase(), mouse.x+12, mouse.y+3.5); }
  if (planting){ const pulse=REDUCED?1:.85+.15*Math.sin(time*.006); bloom(planting.x,planting.y,20*pulse,"255,255,255",.35);
    ctx.beginPath(); ctx.arc(planting.x,planting.y,3.4,0,TAU); ctx.strokeStyle="#fff"; ctx.lineWidth=1; ctx.setLineDash([1.6,1.6]); ctx.stroke(); ctx.setLineDash([]); }
  cv.classList.toggle("hand", !!hover&&(hover.sys||hover.area||hover.orch));
  if (hover && hover.polaris){ ctx.beginPath(); ctx.arc(hover.x,hover.y,14,0,TAU); ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.stroke(); }
  if (hover && !hover.sys){ ctx.beginPath(); ctx.arc(hover.x,hover.y,10,0,TAU); ctx.strokeStyle=hover.agent?"rgba(255,107,59,.8)":"rgba(226,234,244,.7)"; ctx.lineWidth=1; ctx.stroke(); }
  if (hover && hover.orch && crew.hidden){ tip.innerHTML = `<span style="color:#ff6b3b">the crew</span><small>${AGENTS.filter(g=>g.state==="active").length} working · ${AGENTS.filter(g=>g.state==="idle").length} idle · click</small>`; tip.classList.add("on"); tip.style.transform="translate(0,-50%)"; tip.style.left=(mouse.x+16)+"px"; tip.style.top=mouse.y+"px"; }
  else if (hover && !hover.sys){
    const ago = (t) => { const m=Math.round((Date.now()-t)/60000); return m<1?"just now":m<60?`${m} min ago`:`${Math.round(m/60)} h ago`; };
    const g = hover.agent;
    tip.innerHTML = hover.item ? `${esc(hover.item.text)}${hover.item.more?`<em>${esc(hover.item.more)}</em>`:""}<small>${KIND[hover.item.kind]}${hover.item.src?" · from "+esc(hover.item.src):""}</small>`
      : hover.polaris ? `<span style="color:#fff">${esc(NAME)}</span><em>${esc(GOAL||"no goal set — add goal: to sky.yaml")}</em><small>${SYSTEMS.length} systems · ${SYSTEMS.reduce((n,s)=>n+s.areas.length,0)} areas · ${SYSTEMS.reduce((n,s)=>n+s.areas.filter(a=>a.ring===4).length,0)} live · ${AGENTS.filter(g=>g.state==="active").length} agent${AGENTS.filter(g=>g.state==="active").length===1?"":"s"} working</small>`
      : hover.idea ? `${esc(hover.idea.text)}<small>a loose idea · sky.yaml › ideas</small>`
      : hover.about ? `${esc(hover.about.name)}<em>${esc(hover.about.about)}</em><small>${RINGS[hover.about.ring]} · ${hover.about.files} files · ${hover.about.lines} lines</small>`
      : g ? `<span style="color:#ff6b3b">${g.short}${g.subagent?" · subagent":""}</span><em>${esc(g.intent||"no stated intent")}</em>
             <div class="ch"><b>state</b><span>${g.state}${g.where?" · at "+esc(g.where.area):" · home"}</span>
             <b>character</b><span>${esc(Object.entries(g.tools||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k.replace(/^mcp__\w+__/,"")} ×${v}`).join(" · ")||"—")}</span>
             <b>has been in</b><span>${esc(Object.entries(g.areas||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${k} ${v}`).join(" · ")||"—")}</span>

      : `${esc(hover.area.name)}${hover.area.about?`<em>${esc(hover.area.about)}</em>`:""}<small>${RINGS[hover.area.ring]} · ${hover.area.items.length} tracked${hover.area.agents.length?` · ${hover.area.agents.length} agent${hover.area.agents.length>1?"s":""} here`:""} · click to open</small>`;
    tip.classList.add("on");

    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = mouse.x + 14 + tw > W - 12 ? mouse.x - 14 - tw : mouse.x + 14;
    const top = Math.min(Math.max(mouse.y, th/2 + 60), H - th/2 - 12);

}
function setChrome(){
  back.hidden = level.kind==="all";
  key.innerHTML = `<h4>key · ${level.kind==="all"?"the sky":level.kind==="system"?"a system":"a constellation"}</h4><div class="key">${KEYS[level.kind]}</div><p>sky.yaml lives at<br><code>${esc(FILE)}</code></p>`;
  where.innerHTML = level.kind==="all" ? "" : level.kind==="system" ? `<b>${esc(level.sys.name)}</b>` : `${esc(level.sys.name)} <span style="opacity:.5">/</span> <b>${esc(level.area.name)}</b>`;

function go(next){ prev = level; level = next; fade = 0; hover = null; tip.classList.remove("on"); opened = next.kind==="area" ? next.area : null; unplant(); crew.hidden = true; setChrome(); }
function up(){ if (level.kind==="area") go({ kind:"system", sys:level.sys }); else if (level.kind==="system") go({ kind:"all" }); }

/* ---- placing a star: implicit. Where you click decides what it is. ---------
   On the sky, empty space takes a loose idea. In a constellation the regions
   already mean something — above the alpha is the road to the north star, so
   a star placed there is a to-do; left is where questions sit; right is where
   explorations drift; below is what is done. The kind is read off the place. */
function wouldPlace(x, y){
  if (level.kind === "all") return { kind:"idea", area:null, label:"pin an idea" };
  if (level.kind === "area"){
    const C = constellation(level.area);
    if (y < C.cy - 60) return { kind:"todo", area:level.area.name, label:"to do" };
    if (x < C.cx - C.Rx*.45) return { kind:"open", area:level.area.name, label:"open question" };
    if (x > C.cx + C.Rx*.45) return { kind:"explore", area:level.area.name, label:"exploration" };
    return { kind:"done", area:level.area.name, label:"done" };
  }
  return null;
}
function plantAt(x, y){
  const w = wouldPlace(x, y); if (!w) return;
  planting = { ...w, x, y };
  plantKind.textContent = w.label; plantText.value = "";
  plantNote.textContent = SNAPSHOT ? "snapshot — run npm run sky to keep it" : "enter to place · esc to let it go";
  plant.style.left = x + "px"; plant.style.top = y + "px";
  plant.hidden = false; plantText.focus();
}
function unplant(){ planting = null; plant.hidden = true; }
async function commitPlant(){
  if (!planting) return;
  const text = plantText.value.trim(); if (!text){ unplant(); return; }
  if (SNAPSHOT){ plantNote.textContent = "this is a snapshot — nothing was written"; return; }
  const body = { kind: planting.kind, area: planting.area, text, at: [planting.x / W, planting.y / H] };
  const r = await fetch("/api/place", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  if (!r.ok){ const j = await r.json().catch(()=>({})); plantNote.textContent = j.error || "could not place it"; return; }

plantText.addEventListener("keydown", e => { e.stopPropagation(); if (e.key==="Enter") commitPlant(); if (e.key==="Escape") unplant(); });

cv.addEventListener("mousemove",e=>{ mouse={x:e.clientX,y:e.clientY}; if(REDUCED) draw(performance.now()); });
cv.addEventListener("mouseleave",()=>{ mouse=null; tip.classList.remove("on"); });
function showCrew(){
  const ago = (t) => { const m=Math.round((Date.now()-t)/60000); return m<1?"just now":m<60?`${m} min ago`:`${Math.round(m/60)} h ago`; };
  const list = AGENTS.slice().sort((a,b)=> (a.state==="active"?0:1)-(b.state==="active"?0:1) || b.lastAt-a.lastAt);

    (list.length ? list.map(g => `<div class="a ${g.state}"><b>${g.state==="active"?"<i>●</i> ":""}${g.short}${g.subagent?" · subagent":""}${g.where?` · at ${esc(g.where.area)}`:" · home"}</b><em>${esc(g.intent||"no stated intent")}</em><small>${g.lastFile?esc(g.lastFile)+" · ":""}${ago(g.lastAt)}</small></div>`).join("") : `<em>nobody has touched this repo lately</em>`);

cv.addEventListener("click",(e)=>{

});
cv.addEventListener("dblclick",(e)=>{ if (!pick(e.clientX, e.clientY) && !planting && e.clientY > 56) plantAt(e.clientX, e.clientY); });
back.addEventListener("click",up);
document.getElementById("keybtn").addEventListener("click",()=>{ key.hidden=!key.hidden; unplant(); });
mark.addEventListener("mouseenter",()=>{ tip.innerHTML = `<span style="color:#fff">${esc(NAME)}</span><em>${esc(GOAL||"no goal set — add goal: to sky.yaml")}</em><small>${SYSTEMS.length} systems · ${SYSTEMS.reduce((n,s)=>n+s.areas.length,0)} areas · ${SYSTEMS.reduce((n,s)=>n+s.areas.filter(a=>a.ring===4).length,0)} live · ${AGENTS.filter(g=>g.state==="active").length} working</small>`;
  tip.style.transform="translate(0,0)"; tip.style.left="22px"; tip.style.top="50px"; tip.classList.add("on"); });
mark.addEventListener("mouseleave",()=>tip.classList.remove("on"));
addEventListener("keydown",e=>{ if (e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.key==="Escape"){ if(!key.hidden||!crew.hidden||planting){ key.hidden=true; crew.hidden=true; unplant(); } else up(); } if(e.key==="k") key.hidden=!key.hidden; });
addEventListener("resize",()=>{ resize(); if(REDUCED) draw(performance.now()); });

const dot = document.getElementById("livedot"), livetext = document.getElementById("livetext");
const stamp = (t) => { const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString([], { month:"short", day:"numeric" }) + " " + hm; };
if (window.__SKY__){ SNAPSHOT = true; load(window.__SKY__); livetext.textContent = stamp(window.__SKY__.at); dot.title = "a snapshot, taken then"; }
else {
  fetch("/api/sky").then(r=>r.json()).then((d) => { load(d); livetext.textContent = stamp(d.at); }).catch(()=>{});
  const es = new EventSource("/events");
  es.addEventListener("sky", (e) => { const d = JSON.parse(e.data); load(d); dot.classList.remove("off"); livetext.textContent = stamp(d.at); dot.title = "live · last change"; });
  es.onerror = () => { dot.classList.add("off"); dot.title = "reconnecting"; };
}
go({ kind:"all" }); prev=null; fade=1; seedDust(); resize(); requestAnimationFrame(draw);
</script>
